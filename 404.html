    *{margin:0;padding:0;box-sizing:border-box}
    :root{--wa:#25d366;--on-wa:#052a1c;--brand:#0c3b2b;--brand2:#082419}
    html,body{height:100%}
    body{font-family:'Heebo',system-ui,sans-serif;color:#fff;line-height:1.6;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem;
      background:radial-gradient(120% 120% at 80% 0%,#12503a 0%,var(--brand) 45%,var(--brand2) 100%)}
    main{max-width:560px;text-align:center}
    .logo{display:block;height:84px;width:auto;margin:0 auto 1.6rem;filter:drop-shadow(0 8px 22px rgba(0,0,0,.4))}
    .code{display:inline-block;font-weight:800;font-size:.85rem;letter-spacing:.5px;color:#8ff0b6;background:rgba(37,211,102,.14);border:1px solid rgba(37,211,102,.35);border-radius:50px;padding:.3rem .9rem;margin-bottom:1rem}

    p{color:rgba(255,255,255,.85);font-size:1.05rem;margin-bottom:2rem}
    .en{direction:ltr;margin-top:2.2rem;padding-top:1.4rem;border-top:1px solid rgba(255,255,255,.14)}
    .en h2{font-size:1.15rem;font-weight:800;margin-bottom:.3rem}
    .en p{font-size:.95rem;margin-bottom:0}
    .en a{color:var(--wa);font-weight:700}
    .actions{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:.85rem 1.6rem;border-radius:50px;font-weight:800;text-decoration:none;font-size:.98rem}
    .btn-primary{background:var(--wa);color:var(--on-wa)}
    .btn-primary:hover{background:#2ee06f}
    .btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.25)}
    .btn-ghost:hover{background:rgba(255,255,255,.15)}
    a:focus-visible{outline:3px solid var(--wa);outline-offset:3px}
  </style>
</head>
<body>
  <main>
